<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks and Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Marks & Grade Calculator</h1>
        <p class="intro">Enter your marks to calculate percentage and grade.</p>

        <label for="subject">Subject Name</label>
        <input type="text" id="subject" placeholder="e.g. Web Technologies">

        <label for="total">Total Marks</label>
        <input type="number" id="total" placeholder="e.g. 100" min="1">

        <label for="obtained">Obtained Marks</label>
        <input type="number" id="obtained" placeholder="e.g. 85" min="0">

        <button onclick="calculateGrade()">Calculate</button>

        <div id="result"></div>

        <h2>Grading System</h2>
        <p>A: 85–100%</p>
        <p>B: 71–84%</p>
        <p>C: 61–70%</p>
        <p>D: 50–60%</p>
        <p>F: Below 50%</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
